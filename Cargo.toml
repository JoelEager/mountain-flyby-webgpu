[package]
name = "mountain-flyby-webgpu"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgmath = "0.18.0"
winit = "0.30"
wgpu = "30"
env_logger = "0.11"
log = "0.4"
pollster = "1"
bytemuck = { version = "1.16", features = ["derive"] }
cfg-if = "1.0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement", "Performance",
] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures = "0.4.68"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
